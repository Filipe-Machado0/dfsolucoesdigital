<!doctype html>
<html lang="pt-BR" class="scroll-smooth dark">

    <link rel="icon" type="image/png" href="/logo-white.png" />

    <!-- Fontes Google Otimizadas (Apenas pesos essenciais com display=swap não-bloqueante) -->

    </noscript>
